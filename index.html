            /* Zdjęcie pokrywa cały ekran i nie powtarza się */
            background-repeat: no-repeat;
            background-size: cover;
            
            /* Wyśrodkowanie zdjęcia na ekranie */
            background-position: center;
            
            /* Tło pozostaje w miejscu podczas przewijania (efekt paralaksy) */
            background-attachment: fixed;

            margin: 0;
