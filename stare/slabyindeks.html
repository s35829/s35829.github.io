<!DOCTYPE html>
<html lang="pl">
   <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strona główna</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 40px;
            display: flex;
             
            align-items: center;
            min-height: 1000px;
        }

        
        .karuzela-container {
            display: flex;
            gap: 20px;
           
            padding: 20px 0;
            width: 300%;
           
            animation: slide 30s linear infinite;
            scrollbar-width: none;
            
        }

        @keyframes slide {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        
        .zdjecie-item {
            flex: 0 0 250px; 
            height: 250px;
            border-radius: 12px;
            overflow: hidden;
            
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            cursor: pointer;
            display: block;
        }

        
        .zdjecie-item:hover {
            transform: scale(1.08); 
            
        }

        /* Obrazek wewnątrz linku */
        .zdjecie-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }
    </style>
</head>


    <body>
        <header>
            <h1>Strona </h1>
        </header>
