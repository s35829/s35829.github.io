<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">

            footer{
                background-color: rgb(7, 1, 19); color: aliceblue;
                font-size: 50px;
            }

</head>
<body>
    <header>
        <a href="index.html">Powrót</a>
    </header>
    <div class="us">
        <h1>Uśmiech!!</h1>
    </div>
    
    <div class="rozkladfot">
        <svg viewBox="0 0 32 32" class="aparat">
            <rect x="3" y="11" class="st0" width="26" height="14"/>
            <circle class="st0" cx="20" cy="18" r="4.5"/>
            <polygon class="st0" points="21,11 11,11 13,7 19,7 "/>
            <polygon class="blysk" points="8,4 24,11 23,1 4,23 27,1 21,15 1,11 3"/>
            <line class="st1" x1="8" y1="18" x2="12" y2="18"/>
            <line class="st1" x1="26" y1="10" x2="26" y2="11"/>
            <line class="st1" x1="23" y1="10" x2="23" y2="11"/>
        </svg>

</body>
<footer>
    <div class="podpis">
    <p>Gabriela Niewiarowska s35829</p>
    </div>
</html>



<script>
document.addEventListener("DOMContentLoaded", () => {
    const target = document.querySelector('.aparat .st1');
    let triggered = false;
    const animowany = document.querySelector('.blysk');

    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting && !triggered) {
                triggered = true; 
                document.body.classList.add('color-active');
                animowany.classList.add('blysk-start');
                observer.disconnect(); 
            }
        });
    }, {
        threshold: 0.4
    });

    observer.observe(target);
});
</script>
